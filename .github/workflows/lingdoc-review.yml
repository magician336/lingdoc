name: LingDoc Review

# Always create one stable check. Top-level paths filters can leave a required
# check pending forever on unrelated PRs; select expensive steps inside the job.
#
# The gate may also *reuse* an earlier green run: when a pull request turns
# from Draft to Ready for a merge ref that an earlier run of the same pull
# request already tested green -- same head, same main tip, completed and
# successful, produced by this workflow -- the witness (the attest step)
# ends the gate green on that run's record instead of paying the run again.
# The judgement reads machine records only, and any doubt falls back to the
# full rerun below; every other trigger and the workflow_dispatch escape
# hatch always rerun in full. See spec #627 and
# scripts/ci/lingdoc_gate_attest_reuse.py.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # The witness reads an earlier run's checks artifact through the Actions
  # API (spec #627). Read-only, like the rest of this workflow.
  actions: read

concurrency:
  group: lingdoc-review-${{ github.event.pull_request.number || github.ref }}
  # A new push must not cancel the run that is already waiting for a runner.
  # The merge authorisation is a green gate on the *current* head, so
  # cancelling the only verification of a head destroys exactly the
  # invariant the release depends on.  Every head therefore runs its own
  # gate: an old run's result is meaningless for the current head, but it
  # is harmless, and it will not fail to run at all.
  #
  # The cost is that an old run still occupies a runner.  This repository
  # has few pull requests and each pushes a bounded number of heads, so the
  # cost is acceptable here.  See issue #550, and
  # scripts/ci/lingdoc_gate_queue_state.py for the machine-readable
  # "queued or running" judgement this policy needs.
  cancel-in-progress: false

jobs:
  gate:
    name: LingDoc PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      LOG_FORMAT: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: "0"
    steps:
      # Use pull_request (NOT pull_request_target), no secrets or write token.
      # Default checkout tests the merge result; scope uses base...head below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Go is needed by the CI scope scripts' own tests: the "gofmt
      # equivalence" judgement calls gofmt, and the wiring test asserts that
      # every gated workflow declares the outputs its conditions read. Without
      # this step those tests would never run in CI, so the gate that skips
      # test jobs could silently break without anything noticing.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install CI scope script dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements-lingdoc.txt

      - name: Test CI scope scripts
        id: ciscripts
        run: python -m unittest discover -s scripts/ci -p 'test_lingdoc_*.py' -v

      # The gate asks the decision module for the decision.  The module reads
      # only Git and the gate surface manifest, publishes the decision as the
      # step outputs the conditions below read, and checks the pull request's
      # whitespace boundary.  The report is the artifact the steps consume.
      #
      # The module also publishes the conclusion of this gate -- the same
      # three fields every gate publishes, plus the reason of every step
      # that was skipped -- into the summary a reader sees on the pull
      # request page and into the artifact this job uploads.
      #
      # --require-coverage is this gate's release condition: the scope step
      # fails when a surface the contribution touches has no compile or test
      # evidence on this head.  A gate that passes on a surface nobody
      # compiled or tested says nothing about that surface, so it must not
      # give a green conclusion (#602).
      - name: Select checks and check diff whitespace
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-checks"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/ci/lingdoc_gate_decision.py --all \
              --require-coverage \
              --gate .github/workflows/lingdoc-review.yml \
              --artifact-dir "$RUNNER_TEMP/lingdoc-checks" \
              > "$RUNNER_TEMP/lingdoc-checks/scope.json"
          else
            python scripts/ci/lingdoc_gate_decision.py \
              --require-coverage \
              --gate .github/workflows/lingdoc-review.yml \
              --artifact-dir "$RUNNER_TEMP/lingdoc-checks" \
              > "$RUNNER_TEMP/lingdoc-checks/scope.json"
          fi
          cat "$RUNNER_TEMP/lingdoc-checks/scope.json"

      # The witness asks whether an earlier gate run of this same pull
      # request already tested this exact merge ref green (spec #627). It
      # reads only machine records -- this run's own anchor above, the run
      # list of this head, and the candidate run's checks artifact -- and
      # answers reuse or full rerun. Any doubt, any missing record, any API
      # failure falls back to the rerun, and the witness never fails the
      # gate: a crashed attest step degrades to the full rerun below.
      # Only ready_for_review asks; every other trigger reruns in full,
      # exactly as before.
      - name: Ask the witness whether an earlier green run may be reused
        id: attest
        continue-on-error: true
        # The witness reads the Actions API through the gh CLI; inside a
        # runner gh refuses to run without GH_TOKEN, and a tokenless gh is
        # an API failure the witness answers with the full rerun.  The
        # workflow's actions: read permission is what this token spends.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci/lingdoc_gate_attest_witness.py \
            --artifact-dir "$RUNNER_TEMP/lingdoc-checks"

      - name: Install contract validator dependency
        if: steps.scope.outputs.contracts == 'true' && steps.attest.outputs.reuse != 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements-lingdoc.txt

      - name: Validate contract examples and reference trace
        if: steps.scope.outputs.contracts == 'true' && steps.attest.outputs.reuse != 'true'
        id: contracts
        run: |
          python -m unittest discover -s scripts/ci -p 'test_lingdoc_routes.py' -v
          scratch=$(mktemp -d "$RUNNER_TEMP/lingdoc-contracts.XXXXXX")
          cp -R "docs/08-本轮实施方案/contracts/." "$scratch/"
          cp scripts/ci/check_lingdoc_routes.py "$scratch/check_lingdoc_routes.py"
          # Never mistake the committed report for a result from this run.
          rm -f "$scratch/validation-result.json"
          python -X utf8 "$scratch/validate_artifacts.py" --source-root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/lingdoc-checks/contracts.log"
          cp "$scratch/validation-result.json" "$RUNNER_TEMP/lingdoc-checks/validation-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks/validation-result.json').read_text())
          assert report['result'] == 'PASS'
          assert report['scope'] == 'static_design_artifacts_and_reference_trace_only'
          # Counts are intentionally NOT fixed: adding F22 or a new API is valid.
          PY

      - name: Test and vet existing LingDoc provider packages
        if: steps.scope.outputs.run_providers == 'true' && steps.attest.outputs.reuse != 'true'
        id: providers
        env:
          CGO_ENABLED: "1"
        run: |
          mapfile -t targets < <(python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks/scope.json').read_text())
          print('\n'.join(report['provider_packages']))
          PY
          )
          test "${#targets[@]}" -gt 0
          go test -race -count=1 -json "${targets[@]}" | tee "$RUNNER_TEMP/lingdoc-checks/go-test.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks/go-test.jsonl'
          count = sum(1 for line in path.read_text().splitlines()
                      if line and (row := json.loads(line)).get('Test') and row.get('Action') == 'pass')
          if count == 0:
              raise SystemExit('Provider code exists, but no tests passed; do not report an empty suite as coverage.')
          print(f'Passed test/subtest events: {count} (not a coverage percentage)')
          PY
          go vet "${targets[@]}" 2>&1 | tee "$RUNNER_TEMP/lingdoc-checks/go-vet.log"

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.run_frontend == 'true' && steps.attest.outputs.reuse != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test, type-check and build frontend
        if: steps.scope.outputs.run_frontend == 'true' && steps.attest.outputs.reuse != 'true'
        id: frontend
        working-directory: frontend
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/npm-ci.sh" "$GITHUB_WORKSPACE/frontend"
          npm test 2>&1 | tee "$RUNNER_TEMP/lingdoc-checks/frontend-tests.log"
          npm run type-check 2>&1 | tee "$RUNNER_TEMP/lingdoc-checks/frontend-types.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/lingdoc-checks/frontend-build.log"

      - name: Publish check boundary and results
        if: always()
        env:
          CISCRIPTS: ${{ steps.ciscripts.outcome }}
          SCOPE: ${{ steps.scope.outcome }}
          # The attest step may be permanently broken (it carries
          # continue-on-error, so it never fails the gate by itself); its
          # outcome is therefore published with the results, so a damaged
          # witness leaves a trace in the conclusion, not in a step log
          # alone (spec #627).
          ATTEST: ${{ steps.attest.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          PROVIDERS: ${{ steps.providers.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          SURFACE: ${{ steps.scope.outputs.surface }}
          REASON: ${{ steps.scope.outputs.reason }}
          BASE: ${{ steps.scope.outputs.base }}
          REUSE: ${{ steps.attest.outputs.reuse }}
          REUSED_RUN_ID: ${{ steps.attest.outputs.reused_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {key.lower(): os.environ[key] for key in
                    ('CISCRIPTS', 'SCOPE', 'CONTRACTS', 'PROVIDERS', 'FRONTEND')}
          # The witness step's own outcome (success/skipped/failure): the
          # attest step cannot fail the gate, so this is the only place a
          # broken witness becomes visible in the published conclusion.
          result['attest_outcome'] = os.environ.get('ATTEST', '')
          result['tested_sha'] = os.environ['GITHUB_SHA']
          # Whether the conclusion is this run's own or reused from an
          # earlier green run of the same merge ref (spec #627). A reuse
          # leaves the heavy steps skipped; the result says so, and the
          # reused run's scope verdict records are handed on in the
          # artifact, so "skipped is not passed" stays auditable.
          result['reuse'] = os.environ.get('REUSE', '') == 'true'
          reused_run_id = os.environ.get('REUSED_RUN_ID', '')
          result['reused_run_id'] = (int(reused_run_id)
                                     if reused_run_id.isdecimal() else None)
          # The surface says what was tested, the reason says why that surface
          # was chosen, and the base says which baseline it was judged against.
          result['surface'] = os.environ.get('SURFACE', '')
          result['reason'] = os.environ.get('REASON', '')
          result['base'] = os.environ.get('BASE', '')
          # The coverage says who verified each touched surface.  It is read
          # from the report the scope step wrote, not from a new output: a
          # surface nobody compiled or tested must be visible in the
          # conclusion, not hidden behind a green check (#602).
          report = Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks' / 'scope.json'
          coverage = []
          uncovered = False
          if report.is_file():
              try:
                  published = json.loads(report.read_text(encoding='utf-8'))
              except ValueError:
                  published = {}
              coverage = published.get('coverage') or []
              uncovered = bool(published.get('uncovered'))
          result['coverage'] = coverage
          result['uncovered'] = uncovered
          result['boundary'] = 'Automated checks only; not consumer approval, a live-model run, or product acceptance.'
          folder = Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks'
          folder.mkdir(exist_ok=True)
          (folder / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('## LingDoc PR gate\n\n| Check | Outcome |\n|---|---|\n')
              for key in ('ciscripts', 'scope', 'contracts', 'providers', 'frontend'):
                  handle.write(f'| {key} | {result[key]} |\n')
              handle.write(f'| attest (witness) | {result["attest_outcome"]} |\n')
              handle.write(f'\nTested surface: {result["surface"] or "(whole repository)"}\n')
              handle.write(f'Reason: {result["reason"] or "(not recorded)"}\n')
              handle.write(f'Base: {result["base"] or "(not recorded)"}\n')
              if result['reuse']:
                  handle.write(f"Reused: REUSED run #{result['reused_run_id']} -- the witness section above carries the five-condition comparison and the link.\n")
              else:
                  handle.write('Reused: no -- this run verified the merge ref itself.\n')
              handle.write('\nSkipped means NOT RUN, not passed. Provider packages may not exist yet on a planning-only revision.\n\n')
              if coverage:
                  handle.write('### Surface coverage\n\n')
                  handle.write('| Surface | Paths | Verified by | Status |\n|---|---|---|---|\n')
                  for row in coverage:
                      verified_by = ', '.join(row.get('verified_by') or []) or '(nobody)'
                      handle.write(f'| {row.get("surface", "")} | {", ".join(row.get("paths") or [])} | {verified_by} | {row.get("status", "")} |\n')
                  handle.write('\n')
              if uncovered:
                  handle.write('A surface above has no compile or test evidence on this head.\n\n')
              handle.write(result['boundary'] + '\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingdoc-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-checks/
          if-no-files-found: warn
          retention-days: 14
