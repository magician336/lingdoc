name: LingDoc Interface Integration
# Always start on every pull request.  A top-level `paths:` filter would stop
# the workflow from starting at all, leaving the required check pending
# forever and the gate with nowhere to publish its conclusion; the rule is in
# docs/agents/development-rules.md:25, and the header of the pull request gate
# (.github/workflows/lingdoc-review.yml) says the same.  Which job runs is
# decided by the job-level `if` below, which reads the decision module.
#
# This workflow has no push trigger, so the surface paths in
# scripts/ci/lingdoc_gate_surfaces.py are the only copy of the path
# ownership; change them there.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingdoc-interface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      integration: ${{ steps.scope.outputs.job_lingdoc_interface_integration_integration }}
      frontend: ${{ steps.scope.outputs.job_lingdoc_interface_integration_frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/lingdoc-interface-integration.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-interface-integration-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  integration:
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lingdoc_test
          POSTGRES_USER: lingdoc_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lingdoc_test -d lingdoc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CGO_ENABLED: '1'
      LOG_FORMAT: ''
      LINGDOC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LINGDOC_TEST_POSTGRES_DSN: 'host=localhost port=5432 user=lingdoc_test password=synthetic_ci_only dbname=lingdoc_test sslmode=disable'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test closeout matrix helpers
        run: python -m unittest discover -s scripts/acceptance -p 'test_*.py' -v
      - name: Run backend closeout against isolated PostgreSQL
        run: >-
          python scripts/acceptance/lingdoc_backend_closeout.py
          --output-dir "${RUNNER_TEMP}/lingdoc-backend-closeout"
          --require-postgres
      - name: Repeat sequential API contract without race instrumentation
        run: go test -count=20 -run '^TestLingDocRealAPIThroughMainRegistration$' ./internal/router
      - name: Verify RuleSet HTTP-to-export persistence on SQLite and PostgreSQL
        run: go test -count=1 -v -run '^TestRuleSetProductionHTTPToExportPersistsAcrossRestart(SQLite|Postgres)$' ./internal/container
      - name: Upload backend closeout logs and status matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-backend-closeout-${{ github.run_id }}
          path: ${{ runner.temp }}/lingdoc-backend-closeout/
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend consumers
        working-directory: frontend
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/npm-ci.sh" "$GITHUB_WORKSPACE/frontend"
          npm test
          npm run type-check
          npm run build
