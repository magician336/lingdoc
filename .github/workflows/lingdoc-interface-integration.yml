name: LingDoc Interface Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/lingdoc/**'
      - 'internal/evidence/**'
      - 'scripts/acceptance/**'
      - 'internal/container/lingdoc*'
      - 'internal/router/lingdoc*'
      - '.github/workflows/lingdoc-interface-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lingdoc-interface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: Scope latest PR update
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select integration paths changed by this update
        id: scope
        env:
          LINGDOC_SCOPE_PATHS: |
            internal/lingdoc/**
            internal/evidence/**
            scripts/acceptance/**
            internal/container/lingdoc*
            internal/router/lingdoc*
            .github/workflows/lingdoc-interface-integration.yml
        run: python scripts/ci/lingdoc_change_scope.py --patterns "$LINGDOC_SCOPE_PATHS"

  integration:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lingdoc_test
          POSTGRES_USER: lingdoc_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lingdoc_test -d lingdoc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CGO_ENABLED: '1'
      LOG_FORMAT: ''
      LINGDOC_ACCEPTANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LINGDOC_TEST_POSTGRES_DSN: 'host=localhost port=5432 user=lingdoc_test password=synthetic_ci_only dbname=lingdoc_test sslmode=disable'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test closeout matrix helpers
        run: python -m unittest discover -s scripts/acceptance -p 'test_*.py' -v
      - name: Run backend closeout against isolated PostgreSQL
        run: >-
          python scripts/acceptance/lingdoc_backend_closeout.py
          --output-dir "${RUNNER_TEMP}/lingdoc-backend-closeout"
          --require-postgres
      - name: Repeat sequential API contract without race instrumentation
        run: go test -count=20 -run '^TestLingDocRealAPIThroughMainRegistration$' ./internal/router
      - name: Verify RuleSet HTTP-to-export persistence on SQLite and PostgreSQL
        run: go test -count=1 -v -run '^TestRuleSetProductionHTTPToExportPersistsAcrossRestart(SQLite|Postgres)$' ./internal/container/lingdoc.go ./internal/container/lingdoc_ruleset_delivery_e2e_test.go
      - name: Upload backend closeout logs and status matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-backend-closeout-${{ github.run_id }}
          path: ${{ runner.temp }}/lingdoc-backend-closeout/
          if-no-files-found: warn
          retention-days: 14
  frontend:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend consumers
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run type-check
          npm run build
