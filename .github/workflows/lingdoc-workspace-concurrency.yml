name: LingDoc Workspace Concurrency

on:
  pull_request:
    paths:
      - 'internal/lingdoc/workspacecore/**'
      - 'migrations/sqlite/000018_lingdoc_workspace.*.sql'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/lingdoc-workspace-concurrency.yml'

permissions:
  contents: read

concurrency:
  group: workspace-concurrency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope latest PR update
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      # The job outputs are an explicit allow-list. Without this line the
      # formatting-only decision never reaches needs.scope.outputs, and the
      # gate below silently degrades to 'always run'.
      format_only: ${{ steps.scope.outputs.format_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select workspace paths changed by this update
        id: scope
        env:
          LINGDOC_SCOPE_PATHS: |
            internal/lingdoc/workspacecore/**
            migrations/sqlite/000018_lingdoc_workspace.*.sql
            go.mod
            go.sum
            .github/workflows/lingdoc-workspace-concurrency.yml
        run: python scripts/ci/lingdoc_change_scope.py --patterns "$LINGDOC_SCOPE_PATHS"

  workspace-concurrency:
    needs: scope
    # A formatting-only update keeps the meaning of the code, so the test
    # matrix does not have to run again for it.
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.format_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat independent-writer race 100 times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/workspace-concurrency
          go test -json -count=100 -timeout=5m -run '^TestTwoWritersSameSpecRevision$' ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/repeated-race.jsonl
      - name: Repeat held-writer and idempotency regressions
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=10 -timeout=5m -run '^TestSpecRetry(WaitsForActiveWriter|PreservesIdempotencyOrder)$' ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/repeated-retry.jsonl
      - name: Race detector and vet for complete Workspace core
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=5m ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/race-detector.jsonl
          go vet ./internal/lingdoc/workspacecore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-concurrency-${{ github.run_id }}
          path: artifacts/workspace-concurrency/
          if-no-files-found: warn
          retention-days: 14
