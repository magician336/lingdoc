name: LingDoc Review

# Always create one stable check. Top-level paths filters can leave a required
# check pending forever on unrelated PRs; select expensive steps inside the job.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # The delegation failure verification (#734, ADR 0014) reads the check
  # runs of the head the gate publishes about; read is the least that
  # answers it.
  checks: read

concurrency:
  group: lingdoc-review-${{ github.event.pull_request.number || github.ref }}
  # A new push must not cancel the run that is already waiting for a runner.
  # The merge authorisation is a green gate on the *current* head, so
  # cancelling the only verification of a head destroys exactly the
  # invariant the release depends on.  Every head therefore runs its own
  # gate: an old run's result is meaningless for the current head, but it
  # is harmless, and it will not fail to run at all.
  #
  # The cost is that an old run still occupies a runner.  This repository
  # has few pull requests and each pushes a bounded number of heads, so the
  # cost is acceptable here.  See issue #550, and
  # scripts/ci/lingdoc_gate_queue_state.py for the machine-readable
  # "queued or running" judgement this policy needs.
  cancel-in-progress: false

jobs:
  # The decision job: the guard suite, the scope step and the contract
  # validation.  The job outputs are an explicit allow-list (ADR 0005): the
  # shard matrix and the gate job read only what is declared here, and a
  # name that is not declared reads as an empty string.
  prepare:
    name: Decide scope and validate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      LOG_FORMAT: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONOPTIMIZE: "0"
    outputs:
      ciscripts: ${{ steps.ciscripts.outcome }}
      scope: ${{ steps.scope.outcome }}
      contracts: ${{ steps.contracts.outcome }}
      run_providers: ${{ steps.scope.outputs.run_providers }}
      # The shard matrix (#724, ADR 0014): JSON the providers job feeds to
      # fromJSON.  The workflow learns no package names from it -- the list
      # is spelled by the decision module, and only there.
      provider_shards: ${{ steps.scope.outputs.provider_shards }}
      frontend: ${{ steps.scope.outputs.frontend }}
      # The job the delegation names (#734): the gate job verifies its real
      # result on the head SHA before publishing.  Empty exactly when the
      # delegation does not hold, so a face that was not delegated -- or an
      # event that starts no frontend workflow -- costs zero queries.
      frontend_delegate: ${{ steps.scope.outputs.frontend_delegate }}
      surface: ${{ steps.scope.outputs.surface }}
      reason: ${{ steps.scope.outputs.reason }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      # Use pull_request (NOT pull_request_target), no secrets or write token.
      # Default checkout tests the merge result; scope uses base...head below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Go is needed by the CI scope scripts' own tests: the "gofmt
      # equivalence" judgement calls gofmt, and the wiring test asserts that
      # every gated workflow declares the outputs its conditions read. Without
      # this step those tests would never run in CI, so the gate that skips
      # test jobs could silently break without anything noticing.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install CI scope script dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements-lingdoc.txt

      - name: Test CI scope scripts
        id: ciscripts
        run: python -m unittest discover -s scripts/ci -p 'test_lingdoc_*.py' -v

      # The gate asks the decision module for the decision.  The module reads
      # only Git and the gate surface manifest, publishes the decision as the
      # step outputs the conditions below read, and checks the pull request's
      # whitespace boundary.  The report is the artifact the steps consume.
      #
      # The module also publishes the conclusion of this gate -- the same
      # three fields every gate publishes, plus the reason of every step
      # that was skipped -- into the summary a reader sees on the pull
      # request page and into the artifact this job uploads.
      #
      # --require-coverage is this gate's release condition: the scope step
      # fails when a surface the contribution touches has no compile or test
      # evidence on this head.  A gate that passes on a surface nobody
      # compiled or tested says nothing about that surface, so it must not
      # give a green conclusion (#602).
      - name: Select checks and check diff whitespace
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-checks"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/ci/lingdoc_gate_decision.py --all \
              --require-coverage \
              --gate .github/workflows/lingdoc-review.yml \
              --artifact-dir "$RUNNER_TEMP/lingdoc-checks" \
              > "$RUNNER_TEMP/lingdoc-checks/scope.json"
          else
            python scripts/ci/lingdoc_gate_decision.py \
              --require-coverage \
              --gate .github/workflows/lingdoc-review.yml \
              --artifact-dir "$RUNNER_TEMP/lingdoc-checks" \
              > "$RUNNER_TEMP/lingdoc-checks/scope.json"
          fi
          cat "$RUNNER_TEMP/lingdoc-checks/scope.json"

      - name: Install contract validator dependency
        if: steps.scope.outputs.contracts == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/ci/requirements-lingdoc.txt

      - name: Validate contract examples and reference trace
        if: steps.scope.outputs.contracts == 'true'
        id: contracts
        run: |
          python -m unittest discover -s scripts/ci -p 'test_lingdoc_routes.py' -v
          scratch=$(mktemp -d "$RUNNER_TEMP/lingdoc-contracts.XXXXXX")
          cp -R "docs/08-本轮实施方案/contracts/." "$scratch/"
          cp scripts/ci/check_lingdoc_routes.py "$scratch/check_lingdoc_routes.py"
          # Never mistake the committed report for a result from this run.
          rm -f "$scratch/validation-result.json"
          python -X utf8 "$scratch/validate_artifacts.py" --source-root "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/lingdoc-checks/contracts.log"
          cp "$scratch/validation-result.json" "$RUNNER_TEMP/lingdoc-checks/validation-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks/validation-result.json').read_text())
          assert report['result'] == 'PASS'
          assert report['scope'] == 'static_design_artifacts_and_reference_trace_only'
          # Counts are intentionally NOT fixed: adding F22 or a new API is valid.
          PY

      # The conclusion and the scope report travel to the gate job through
      # this artifact: the coverage table of the final result is read from
      # the report the decision step wrote, never re-derived.
      - name: Publish the scope report and the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-checks-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-checks/
          if-no-files-found: warn
          retention-days: 14

  # The provider verification, sharded (#724, ADR 0014): one shard is one
  # entry of the decision module's shard list, and every shard runs the same
  # test command over its own package list.  A shard may carry a -run filter
  # (ADR 0015): the decision module's test-name partition of a package it
  # splits -- consumed from the matrix like the package list, never spelled
  # here.  The matrix is generated from the
  # output the prepare job declares above -- this workflow carries no package
  # names, and adding a package root never touches it.
  providers:
    name: Provider shard ${{ matrix.shard.name }}
    needs: prepare
    # One boolean selects the verification: the decision module already
    # folded the formatting-only shortcut into it.  The second term only
    # keeps the matrix from being empty (an empty matrix is a job error, not
    # a skip): the shard list is empty exactly when the boolean is false.
    if: needs.prepare.outputs.run_providers == 'true' && needs.prepare.outputs.provider_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.provider_shards) }}
    env:
      CGO_ENABLED: "1"
      SHARD_PACKAGES: ${{ matrix.shard.packages }}
      SHARD_NAME: ${{ matrix.shard.name }}
      SHARD_TEST_FILTER: ${{ matrix.shard.go_test_filter }}
    steps:
      # Default checkout tests the merge result; depth one is enough, the
      # shard diffed nothing -- the decision was made in the prepare job.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test and vet the provider packages of this shard
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-checks"
          # -timeout 15m: the workspace package's single binary ran 590-600s
          # on the runner (job wall 642-660s, dispatch 40451195877) against
          # go test's default 10m package timeout — zero margin, one slow
          # runner day from an intermittent required-check red. The
          # job-level timeout still bounds a hung run.
          # -run (ADR 0015): only what the decision module's shard data
          # carries; an empty filter runs the whole package unfiltered.
          FILTER_ARGS=()
          if [ -n "$SHARD_TEST_FILTER" ]; then
            FILTER_ARGS+=( -run "$SHARD_TEST_FILTER" )
          fi
          go test -race -count=1 -timeout 15m -json "${FILTER_ARGS[@]}" $SHARD_PACKAGES | tee "$RUNNER_TEMP/lingdoc-checks/go-test-$SHARD_NAME.jsonl"
          python - <<'PY'
          import json, os
          from pathlib import Path
          name = os.environ['SHARD_NAME']
          log = (Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks'
                 / f'go-test-{name}.jsonl')
          count = sum(1 for line in log.read_text().splitlines()
                      if line and (row := json.loads(line)).get('Test') and row.get('Action') == 'pass')
          if count == 0:
              raise SystemExit(f'Provider shard {name}: provider code exists, but no tests passed; do not report an empty suite as coverage.')
          print(f'Provider shard {name}: passed test/subtest events: {count} (not a coverage percentage)')
          PY
          go vet $SHARD_PACKAGES 2>&1 | tee "$RUNNER_TEMP/lingdoc-checks/go-vet-$SHARD_NAME.log"

      # The marker is the shard's evidence: it exists only after this
      # shard's tests, its not-empty assertion and its vet all passed, and
      # the gate job reads it to name the shards that failed.
      - name: Mark this shard verified
        if: success()
        run: touch "$RUNNER_TEMP/lingdoc-checks/provider-shard-$SHARD_NAME.passed"

      - name: Upload the shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-provider-shard-${{ matrix.shard.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lingdoc-checks/
          if-no-files-found: warn
          retention-days: 14

  # The gate itself: the job the branch ruleset demands, by the display name
  # it has always shown.  It aggregates the decision job and every shard --
  # a red step or a red shard turns this check red -- and publishes the
  # result artifact and the summary, whether it passes or not.
  gate:
    name: LingDoc PR gate
    needs: [prepare, providers]
    if: always()
    runs-on: ubuntu-latest
    # 15 minutes: the publish step waits for the delegated frontend job
    # inside a 10-minute polling window (#734); the extra five cover the
    # artifact downloads and the setup steps.
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PREPARE_RESULT: ${{ needs.prepare.result }}
      PROVIDERS: ${{ needs.providers.result }}
      CISCRIPTS: ${{ needs.prepare.outputs.ciscripts }}
      SCOPE: ${{ needs.prepare.outputs.scope }}
      CONTRACTS: ${{ needs.prepare.outputs.contracts }}
      # The frontend row is the decision's delegation verdict ("delegated
      # to frontend.yml#verify (...)" or an explicit "not run"), not the
      # outcome of a step this workflow no longer has.
      FRONTEND: ${{ needs.prepare.outputs.frontend }}
      # The delegation failure verification (#734, ADR 0014): the job the
      # delegation names, and the pull request's head SHA -- the frontend
      # workflow's check runs attach to the head commit, not to the merge
      # commit GITHUB_SHA names (read off PR #731's check runs).
      FRONTEND_DELEGATE: ${{ needs.prepare.outputs.frontend_delegate }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SURFACE: ${{ needs.prepare.outputs.surface }}
      REASON: ${{ needs.prepare.outputs.reason }}
      BASE: ${{ needs.prepare.outputs.base }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A decision job that died before writing its report must not hide
      # behind a download error: the publish step below reports what it
      # sees, and the aggregation turns a red decision job into a red gate.
      - name: Download the scope report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: lingdoc-checks-scope-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-checks/

      - name: Download the provider shard logs
        if: needs.providers.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: lingdoc-provider-shard-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/lingdoc-checks/

      - name: Publish check boundary and results
        if: always()
        env:
          # The delegation verification (#734) reads the head's check runs;
          # this token carries exactly this workflow's permissions
          # (contents: read, checks: read) and nothing more.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys, time
          import urllib.request
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'lingdoc-checks'
          result = {key.lower(): os.environ.get(key, '') for key in
                    ('CISCRIPTS', 'SCOPE', 'CONTRACTS', 'PROVIDERS', 'FRONTEND')}
          result['tested_sha'] = os.environ.get('GITHUB_SHA', '')
          # The surface says what was tested, the reason says why that surface
          # was chosen, and the base says which baseline it was judged against.
          result['surface'] = os.environ.get('SURFACE', '')
          result['reason'] = os.environ.get('REASON', '')
          result['base'] = os.environ.get('BASE', '')
          # The coverage says who verified each touched surface.  It is read
          # from the report the decision step wrote: a surface nobody
          # compiled or tested must be visible in the conclusion, not hidden
          # behind a green check (#602).
          report = folder / 'scope.json'
          coverage = []
          uncovered = False
          shards = []
          if report.is_file():
              try:
                  published = json.loads(report.read_text(encoding='utf-8'))
              except ValueError:
                  published = {}
              coverage = published.get('coverage') or []
              uncovered = bool(published.get('uncovered'))
              shards = published.get('provider_shards') or []

          # -- the delegation failure verification (#734, ADR 0014) -----------
          # The gate does not run the frontend checks; the frontend workflow's
          # verify job does.  When the decision delegated the verification,
          # the gate asks the check runs of the pull request's head SHA
          # whether that job really finished here -- and exactly one
          # conclusion keeps the delegation green: success.  A head where the
          # frontend workflow did not really run (trigger, queue, failure all
          # count as not run) must stay red, so a failed conclusion, a window
          # that closes on an absent or pending run, and a failed query all
          # turn this gate red and name the job and the state that caused
          # it.  A query failure fails closed: it is never a silent pass.
          def api_get(url, token):
              headers = {'Accept': 'application/vnd.github+json'}
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              request = urllib.request.Request(url, headers=headers)
              # The runner's proxy settings must not intercept this query.
              opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({}))
              with opener.open(request, timeout=30) as response:
                  return (response.status,
                          json.loads(response.read().decode('utf-8')))

          def delegate_verdict(runs, name):
              # The observed state of the delegated job on this head.
              # Same-named runs are judged together: a real success settles
              # the delegation; a live run keeps the gate waiting
              # (frontend.yml cancels in progress on a re-push, and a stale
              # `cancelled` run must not read as a failure); otherwise the
              # newest completed run's conclusion names the failure.
              found = sorted((run for run in runs if run.get('name') == name),
                             key=lambda run: run.get('id') or 0)
              if not found:
                  return 'pending', 'no check run on this head yet'
              for run in found:
                  if (run.get('status') == 'completed'
                          and run.get('conclusion') == 'success'):
                      return 'verified', 'conclusion=success'
              for run in found:
                  if run.get('status') != 'completed':
                      return 'pending', 'status=' + str(run.get('status'))
              return 'failed', 'conclusion=' + str(found[-1].get('conclusion'))

          def fetch_check_runs(base, repo, sha, token):
              # All check runs of one head, paging through the whole list.
              runs = []
              page = 1
              while True:
                  url = (f'{base}/repos/{repo}/commits/{sha}/check-runs'
                         f'?per_page=100&page={page}')
                  status, body = api_get(url, token)
                  if status != 200:
                      raise RuntimeError(f'HTTP {status} from {url}')
                  batch = list((body or {}).get('check_runs') or ())
                  runs.extend(batch)
                  if len(batch) < 100:
                      return runs
                  page += 1

          def verify_delegation(name, head):
              # Poll the delegated job's real result; never fail open.  The
              # window and its interval are env knobs (defaults: 30s
              # interval, 10-minute window -- the measured frontend job runs
              # ~154s, so the window carries a wide margin).
              api = os.environ.get('GITHUB_API_URL',
                                   'https://api.github.com').rstrip('/')
              repo = os.environ.get('GITHUB_REPOSITORY', '')
              token = os.environ.get('GITHUB_TOKEN', '')
              interval = float(os.environ.get('GATE_DELEGATION_POLL_INTERVAL',
                                              '30'))
              window = float(os.environ.get('GATE_DELEGATION_POLL_TIMEOUT',
                                            '600'))
              deadline = time.monotonic() + window
              while True:
                  if not head:
                      return {'delegated_job': name,
                              'outcome': 'query-failed',
                              'detail': 'query failed: no head SHA to ask '
                                        'about'}
                  try:
                      runs = fetch_check_runs(api, repo, head, token)
                  except Exception as error:  # fail closed on any failure
                      return {'delegated_job': name,
                              'outcome': 'query-failed',
                              'detail': 'query failed: ' + str(error)}
                  outcome, detail = delegate_verdict(runs, name)
                  if outcome != 'pending':
                      return {'delegated_job': name, 'outcome': outcome,
                              'detail': detail}
                  if time.monotonic() >= deadline:
                      return {'delegated_job': name, 'outcome': 'timeout',
                              'detail': (detail + '; polling window exhausted '
                                         f'({window:g}s)')}
                  time.sleep(interval)

          # Only a delegated face is verified: an empty delegate key -- an
          # unselected frontend, a dispatch that starts no frontend
          # workflow -- costs zero queries.
          delegate = os.environ.get('FRONTEND_DELEGATE', '').strip()
          delegation = {}
          if delegate:
              delegation = verify_delegation(
                  delegate, os.environ.get('HEAD_SHA', '').strip())

          # A shard is verified when its marker exists: the marker step only
          # runs after that shard's tests, its not-empty assertion and its
          # vet all passed (#724).
          outcomes = [{'name': shard.get('name', ''),
                       'verified': (folder / ('provider-shard-'
                                              + shard.get('name', '')
                                              + '.passed')).is_file()}
                      for shard in shards]
          result['provider_shards'] = outcomes
          result['coverage'] = coverage
          result['uncovered'] = uncovered
          # The delegated job's real result on this head, when the gate had
          # to ask (#734): an empty object says no delegation held, so
          # nothing was queried.
          result['frontend_delegation'] = delegation
          # The boundary keeps delegation and skipping apart (ADR 0014): a
          # delegated check has real evidence on the named job of the
          # frontend workflow on this head; a skipped check is NOT RUN.
          result['boundary'] = ('Automated checks only; not consumer approval, '
                                'a live-model run, or product acceptance. '
                                'A delegated check is verified by the named job '
                                'of the frontend workflow on this head; a '
                                'skipped check is NOT RUN.')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'result.json').write_text(json.dumps(result, indent=2) + '\n')
          # The gate verdict: the decision job's steps and every shard have
          # to pass, or this check -- the one the ruleset demands -- is red,
          # and the failure names what failed.
          failures = []
          for key, label in (('CISCRIPTS', 'the guard suite'),
                             ('SCOPE', 'the decision step'),
                             ('CONTRACTS', 'the contract validation')):
              value = os.environ.get(key, '')
              if value == 'success' or (key == 'CONTRACTS' and value in ('', 'skipped')):
                  continue
              failures.append(f'{label} did not pass on this head '
                              f'({key.lower()}={value or "skipped"})')
          providers = os.environ.get('PROVIDERS', '')
          failed_shards = [row['name'] for row in outcomes if not row['verified']]
          if providers not in ('success', 'skipped'):
              if failed_shards:
                  failures.append('provider shard(s) failed on this head: '
                                  + ', '.join(f'Provider shard {name}'
                                              for name in failed_shards))
              else:
                  failures.append(f'the provider shard matrix ended with {providers}')
          if not failures and delegation and delegation['outcome'] != 'verified':
              # The delegation's real result on this head (ADR 0014): the
              # failure names the delegated job and the state that caused it.
              failures.append(
                  'the delegated frontend verification did not pass on this '
                  f"head: {delegation['delegated_job']} "
                  f"({delegation['detail']})")
          if not failures and os.environ.get('PREPARE_RESULT') != 'success':
              failures.append('the decision job did not finish successfully')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('## LingDoc PR gate\n\n| Check | Outcome |\n|---|---|\n')
              for key in ('ciscripts', 'scope', 'contracts', 'providers', 'frontend'):
                  handle.write(f'| {key} | {result[key]} |\n')
              if delegation:
                  handle.write('| frontend delegation | '
                               + delegation['delegated_job'] + ': '
                               + delegation['outcome'] + ' ('
                               + delegation['detail'] + ') |\n')
              handle.write(f'\nTested surface: {result["surface"] or "(whole repository)"}\n')
              handle.write(f'Reason: {result["reason"] or "(not recorded)"}\n')
              handle.write(f'Base: {result["base"] or "(not recorded)"}\n')
              handle.write('\nSkipped means NOT RUN, not passed. Provider packages may not exist yet on a planning-only revision.\n')
              handle.write('Delegated is not skipped: a delegated check is verified by the named job of the frontend workflow on this head; its evidence is real there.\n\n')
              if outcomes:
                  handle.write('### Provider shards\n\n')
                  handle.write('| Shard | Outcome |\n|---|---|\n')
                  for row in outcomes:
                      handle.write(f'| Provider shard {row["name"]} | '
                                   + ('verified' if row['verified']
                                      else 'failed or did not finish') + ' |\n')
                  handle.write('\n')
              if coverage:
                  handle.write('### Surface coverage\n\n')
                  handle.write('| Surface | Paths | Verified by | Status |\n|---|---|---|---|\n')
                  for row in coverage:
                      verified_by = ', '.join(row.get('verified_by') or []) or '(nobody)'
                      handle.write(f'| {row.get("surface", "")} | {", ".join(row.get("paths") or [])} | {verified_by} | {row.get("status", "")} |\n')
                  handle.write('\n')
              if uncovered:
                  handle.write('A surface above has no compile or test evidence on this head.\n\n')
              handle.write(result['boundary'] + '\n')
          if failures:
              for failure in failures:
                  print(f'error: {failure}', file=sys.stderr)
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingdoc-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-checks/
          if-no-files-found: warn
          retention-days: 14
