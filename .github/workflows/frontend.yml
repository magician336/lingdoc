name: Frontend

# Always start on every pull request.  A top-level `paths:` filter would stop
# the workflow from starting at all, leaving the required check pending
# forever and the gate with nowhere to publish its conclusion; the rule is in
# docs/agents/development-rules.md:25, and the header of the pull request gate
# (.github/workflows/lingdoc-review.yml) says the same.  Which job runs is
# decided by the job-level `if` below, which reads the decision module.
#
# The `push:` path list below is a static mirror of the surface paths in
# scripts/ci/lingdoc_gate_surfaces.py.  GitHub cannot generate `paths:`
# dynamically, so the mirror is maintained by hand: change the manifest and
# this list together.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_frontend_dist.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      verify: ${{ steps.scope.outputs.job_frontend_verify }}
      docker-image: ${{ steps.scope.outputs.job_frontend_docker_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/frontend.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Test, type-check, and build
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-ci.sh" "$GITHUB_WORKSPACE/frontend"

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-image:
    name: Docker multi-stage image
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.docker-image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build UI image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_FRONTEND_COMMIT="${GITHUB_SHA::7}" \
            -t weknora-ui:ci \
            frontend/
