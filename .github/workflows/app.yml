name: App

# Anydoc (Rust archive + `anydoc` build tag) lives in anydoc.yml so a
# migrations-only or unrelated Go PR does not compile the parser engine.

# Gate trigger rules: docs/agents/development-rules.md:26; path ownership: scripts/ci/lingdoc_gate_surfaces.py.
on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "!cli/**"
      - "!client/**"
      - "!docreader/**"
      - "!third_party/anydoc-go/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "config/**"
      - "migrations/**"
      - "skills/preloaded/**"
      - "testdata/**"
      - "docker/Dockerfile.app"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "licenses/**"
      - "internal/textconv/data/**"
      - "scripts/*license*.sh"
      - "cmd/desktop/build/windows/installer/project.nsi"
      - ".github/workflows/app.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  # Keep tests independent of a developer machine's custom log template.
  LOG_FORMAT: ""
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job, plus the reverse-delegation list
    # the verify job consumes (#737); only the declared ones reach the jobs
    # below, and a name that is not declared reads as an empty string.
    outputs:
      verify: ${{ steps.scope.outputs.job_app_verify }}
      # The reverse delegation (#737, ADR 0014): on pull_request events the
      # verify job leaves the provider packages the gate's shards verify to
      # those shards.  The package list is the decision module's answer --
      # this workflow carries no package names (red line four).
      provider_delegate: ${{ steps.scope.outputs.provider_delegate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/app.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Format, vet, test, and build
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The delegated provider packages (#737): the decision module's list,
      # empty exactly when the gate's provider shards do not run on this
      # head.  The vet-and-test step treats every failure of this data as
      # "run everything" (fail-open).
      PROVIDER_DELEGATION: ${{ needs.scope.outputs.provider_delegate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          # v6 defaults to go.mod for the cache key (more stable than go.sum).

      - name: Download modules
        run: go mod download

      - name: Verify third-party notices and source bundle
        run: |
          bash ./scripts/check-license-bundle.sh
          bash ./scripts/test-license-bundle.sh

      - name: Check formatting
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare base..head, not the PR merge commit, so files changed only
            # on main after the branch point are not attributed to this PR.
            diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            base="$BASE_SHA"
            if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
              base=$(git rev-parse HEAD^)
            fi
            diff_range="$base..$GITHUB_SHA"
          fi
          unformatted=$(
            git diff --name-only --diff-filter=ACMR -z "$diff_range" -- '*.go' ':!cli/**' |
              xargs -0 -r gofmt -l
          )
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/docreader/')

          # Ticket #737 (the reverse delegation, ADR 0014): on pull_request
          # events the provider packages that the PR gate's shards really
          # verify on this head (-race -count=1) are not run a second time
          # here without -race.  A push to main keeps the full list: the
          # repository-wide validation does not shrink.  Fail-open: a
          # non-PR event, an empty or unreadable delegation, or an
          # exclusion that would empty the test set all fall back to
          # running everything.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PROVIDER_DELEGATION" ]; then
            if delegated=$(go list $PROVIDER_DELEGATION 2>/dev/null) && [ -n "$delegated" ]; then
              mapfile -t delegated_pkgs < <(printf '%s\n' "$delegated")
              mapfile -t remaining < <(
                printf '%s\n' "${pkgs[@]}" | grep -vxF -f <(printf '%s\n' "$delegated") || true
              )
              if [ "${#remaining[@]}" -gt 0 ]; then
                echo "Provider verification is delegated to the PR gate's provider shards on this head (race): $PROVIDER_DELEGATION"
                echo "Delegated ${#delegated_pkgs[@]} provider package(s); vetting and testing the remaining ${#remaining[@]}."
                pkgs=("${remaining[@]}")
              else
                echo "The delegation would empty the test set; keeping the full list."
              fi
            else
              echo "The delegated package list could not be resolved; keeping the full list."
            fi
          fi

          go vet "${pkgs[@]}"
          go test "${pkgs[@]}"

      - name: Build server
        run: go build ./cmd/server
