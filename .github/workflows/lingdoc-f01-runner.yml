name: LingDoc F01 Runner

# Always start on every pull request.  A top-level `paths:` filter would stop
# the workflow from starting at all, leaving the required check pending
# forever and the gate with nowhere to publish its conclusion; the rule is in
# docs/agents/development-rules.md:25, and the header of the pull request gate
# (.github/workflows/lingdoc-review.yml) says the same.  Which job runs is
# decided by the job-level `if` below, which reads the decision module.
#
# This workflow has no push trigger, so the surface paths in
# scripts/ci/lingdoc_gate_surfaces.py are the only copy of the path
# ownership; change them there.
on:
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      runner-tests: ${{ steps.scope.outputs.job_lingdoc_f01_runner_runner_tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/lingdoc-f01-runner.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-f01-runner-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  runner-tests:
    name: F01 runner regression
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.runner-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PR whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Run synthetic runner and report regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m unittest discover -s scripts/lingdoc_mock -p 'test_workflow*.py' -v 2>&1 | tee artifacts/f01-runner-tests.log
          python -m py_compile scripts/lingdoc_mock/run_f01.py scripts/lingdoc_mock/load_state.py scripts/lingdoc_mock/run_scenario.py scripts/lingdoc_mock/build_t15_matrix.py scripts/lingdoc_mock/test_workflow_runner.py scripts/lingdoc_mock/test_workflow_reports.py scripts/lingdoc_mock/test_workflow_specs.py scripts/lingdoc_mock/test_workflow_states.py scripts/lingdoc_mock/test_workflow_scenario.py scripts/lingdoc_mock/test_workflow_matrix.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f01-runner-tests-${{ github.run_id }}
          path: artifacts/f01-runner-tests.log
          if-no-files-found: warn
