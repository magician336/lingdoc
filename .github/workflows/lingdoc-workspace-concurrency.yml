name: LingDoc Workspace Concurrency

# Gate trigger rules: docs/agents/development-rules.md:26; path ownership: scripts/ci/lingdoc_gate_surfaces.py.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-concurrency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      workspace-concurrency: ${{ steps.scope.outputs.job_lingdoc_workspace_concurrency_workspace_concurrency }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/lingdoc-workspace-concurrency.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-workspace-concurrency-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  workspace-concurrency:
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.workspace-concurrency == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Repeat independent-writer race 100 times
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/workspace-concurrency
          go test -json -count=100 -timeout=5m -run '^TestTwoWritersSameSpecRevision$' ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/repeated-race.jsonl
      - name: Repeat held-writer and idempotency regressions
        shell: bash
        run: |
          set -euo pipefail
          go test -json -count=10 -timeout=5m -run '^TestSpecRetry(WaitsForActiveWriter|PreservesIdempotencyOrder)$' ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/repeated-retry.jsonl
      - name: Race detector and vet for complete Workspace core
        shell: bash
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=5m ./internal/lingdoc/workspacecore | tee artifacts/workspace-concurrency/race-detector.jsonl
          go vet ./internal/lingdoc/workspacecore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-concurrency-${{ github.run_id }}
          path: artifacts/workspace-concurrency/
          if-no-files-found: warn
          retention-days: 14
