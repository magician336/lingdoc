name: Go Lint

# The repository carries a large backlog of pre-existing golangci-lint findings,
# so pull requests are only judged on the code they introduce (`--new-from-rev`).
# Use the full local Git history to obtain the PR merge base: GitHub diff media
# responses fail above 300 files. A missing/invalid base is an explicit failure,
# never a silent switch to a full-repository backlog or a successful skipped lint.

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"
      - ".github/scripts/prepare-go-lint-diff*.mjs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      changes: ${{ steps.scope.outputs.job_go_lint_changes }}
      golangci: ${{ steps.scope.outputs.job_go_lint_golangci }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/go-lint.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-lint-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  # Path filters above start this workflow for any Go change; the matrix still
  # used to lint all three modules. Detect which modules the PR actually
  # touches so a root-only change (migrations test, handler, …) does not queue
  # cli/ and client/ runners. Changing .golangci.yml or this workflow still
  # lints every module, since they share the root config.
  changes:
    name: detect lint modules
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.  Lint is the judge of formatting, so it is
    # never skipped by the formatting-only shortcut.
    if: needs.scope.outputs.changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed modules
        id: detect
        shell: bash
        run: |
          diff_range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          modules=()
          if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
               .golangci.yml .github/workflows/go-lint.yml '.github/scripts/prepare-go-lint-diff*.mjs' | grep -q .; then
            modules=("." "cli" "client")
          else
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
                 '*.go' ':!cli/**' ':!client/**' go.mod go.sum | grep -q .; then
              modules+=(".")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'cli/**' | grep -q .; then
              modules+=("cli")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'client/**' | grep -q .; then
              modules+=("client")
            fi
          fi
          json="["
          first=1
          for m in "${modules[@]}"; do
            if [ "$first" -eq 1 ]; then
              first=0
            else
              json+=","
            fi
            json+="\"${m}\""
          done
          json+="]"
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: [changes, scope]
    # The decision says whether this job runs.  The second term keeps the
    # matrix from being empty: an empty matrix is a job error, not a skip,
    # and a pull request that touches no lintable module has no module to
    # lint.
    if: needs.scope.outputs.golangci == 'true' && needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test local lint diff boundary
        run: node --test .github/scripts/prepare-go-lint-diff.test.mjs

      - name: Resolve exact PR lint baseline locally
        id: lint_diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/prepare-go-lint-diff.mjs

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          only-new-issues: false
          args: --new-from-rev=${{ steps.lint_diff.outputs.base_sha }}
