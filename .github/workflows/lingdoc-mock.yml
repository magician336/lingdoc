name: LingDoc Mock
# Always start on every pull request.  A top-level `paths:` filter would stop
# the workflow from starting at all, leaving the required check pending
# forever and the gate with nowhere to publish its conclusion; the rule is in
# docs/agents/development-rules.md:25, and the header of the pull request gate
# (.github/workflows/lingdoc-review.yml) says the same.  Which job runs is
# decided by the job-level `if` below, which reads the decision module.
#
# This workflow has no push trigger, so the surface paths in
# scripts/ci/lingdoc_gate_surfaces.py are the only copy of the path
# ownership; change them there.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lingdoc-mock-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    name: Decide what this gate runs
    runs-on: ubuntu-latest
    # The job outputs are an explicit allow-list.  The decision module
    # publishes one key per consuming job; only the declared ones reach the
    # jobs below, and a name that is not declared reads as an empty string.
    outputs:
      mock: ${{ steps.scope.outputs.job_lingdoc_mock_mock }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what this gate runs
        id: scope
        # The decision module owns the path table of this gate, the tested
        # surface and the formatting-only shortcut.  The workflow only reads
        # its answer.  The whitespace boundary belongs to the pull request
        # gate, so it is not repeated here.
        #
        # The module also publishes the conclusion of this gate: the summary
        # a reader sees on the pull request page and the artifact a reviewer
        # downloads.  A skipped check carries its reason there.
        run: |
          mkdir -p "$RUNNER_TEMP/lingdoc-gate-conclusion"
          python scripts/ci/lingdoc_gate_decision.py --no-whitespace \
            --gate .github/workflows/lingdoc-mock.yml \
            --artifact-dir "$RUNNER_TEMP/lingdoc-gate-conclusion" \
            > "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"
          cat "$RUNNER_TEMP/lingdoc-gate-conclusion/scope.json"

      # The conclusion is published even when every check of this gate is
      # skipped: "skipped" alone never says why.
      - name: Publish the gate conclusion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lingdoc-mock-conclusion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lingdoc-gate-conclusion/
          if-no-files-found: warn
          retention-days: 14

  mock:
    name: T06 fixed mock and request consumer
    needs: scope
    # The decision says whether this job runs; the job reads that one
    # boolean and nothing else.
    if: needs.scope.outputs.mock == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/ci/requirements-lingdoc.txt
      - name: Test engine, actual contract and corrupt-response rejection
        run: |
          python -m unittest discover -s scripts/lingdoc_mock -p 'test_*.py' -v
          python scripts/lingdoc_mock/server.py --check
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash "$GITHUB_WORKSPACE/scripts/ci/npm-ci.sh" "$GITHUB_WORKSPACE/frontend"
      - name: Actual HTTP, Axios request layer and browser consumption
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lingdoc_mock/server.py > "$RUNNER_TEMP/t06-mock.log" 2>&1 &
          mock_pid=$!
          (cd frontend && npm run dev -- --host 127.0.0.1 --strictPort) > "$RUNNER_TEMP/t06-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$mock_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4010/api/v1/lingdoc/templates/template-demo > /dev/null &&
               curl --fail --silent http://127.0.0.1:5173/lingdoc-mock.html > /dev/null; then break; fi
            sleep 1
          done
          (cd frontend && LINGDOC_MOCK_ORIGIN=http://127.0.0.1:4010 npx tsx --test src/dev/lingdoc-mock/*.test.*)
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node scripts/lingdoc_mock/browser_smoke.mjs
      - name: Type-check and build (mock page must not enter release output)
        working-directory: frontend
        run: |
          npm run type-check
          npm run build-only
          test ! -e dist/lingdoc-mock.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t06-service-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t06-mock.log
            ${{ runner.temp }}/t06-vite.log
          if-no-files-found: ignore
          retention-days: 7
